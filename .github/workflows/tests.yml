name: tests
on: [push, pull_request]
jobs:
  sql-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Only the logic tests run here: the 45 MB dataset is not committed. pages.yml rebuilds it and runs the full suite.
      - run: pytest -q tests/test_sql_logic.py
