name: tests
on: [push, pull_request]
jobs:
  sql-logic:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root  # throwaway CI container, not a real secret
          MYSQL_DATABASE: retail_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/retail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Only the logic tests run here: the 45 MB dataset is not committed. pages.yml rebuilds it and runs the full suite.
      - run: pytest -q tests/test_sql_logic.py
